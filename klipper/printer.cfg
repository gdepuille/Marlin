# =============================================================================
# Klipper configuration - Alfawise U20 (Longer3D LK1 compatible)
# Board : Longer3D V08 - STM32F103VET6
# Généré depuis la configuration Marlin (Configuration.h / Configuration_adv.h)
# =============================================================================
#
# ÉTAPES POUR COMPILER KLIPPER POUR CETTE CARTE :
#   cd ~/klipper
#   make menuconfig
#     Micro-controller Architecture : STM32
#     Processor model               : STM32F103 (high density)
#     Bootloader offset             : 64KiB (offset 0x10000 - Robin Nano style)
#     Communication interface       : Serial (on USART1 PA10/PA9)
#     Baud rate                     : 250000
#   make
#
# FLASH : copier klipper.bin sur carte SD et le renommer en 'project.bin',
# insérer la carte dans l'imprimante éteinte, allumer → flash automatique.
#
# CONNEXION SÉRIE : trouver le port avec :
#   ls /dev/serial/by-id/
# =============================================================================

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0   # À ajuster !
baud: 250000
restart_method: command

# =============================================================================
# IMPRIMANTE
# =============================================================================

[printer]
kinematics: cartesian
max_velocity: 200          # DEFAULT_MAX_FEEDRATE X/Y
max_accel: 200             # DEFAULT_ACCELERATION
max_z_velocity: 100        # DEFAULT_MAX_FEEDRATE Z
max_z_accel: 100           # DEFAULT_MAX_ACCELERATION Z
square_corner_velocity: 5.0  # ≈ équivalent JUNCTION_DEVIATION_MM 0.10

# =============================================================================
# MOTEURS PAS-À-PAS  (drivers A4988)
# Activation active LOW → enable_pin: !Pxx
# =============================================================================

[stepper_x]
step_pin: PB4
dir_pin: !PB3              # INVERT_X_DIR = true
enable_pin: !PB5
microsteps: 16
rotation_distance: 40      # 80 steps/mm × 16 µsteps / (200 pas/tr) = 40 mm/tr
endstop_pin: ^!PC1         # X_MIN_PIN, pullup + actif bas (switch NO → GND)
position_endstop: 0
position_min: 0
position_max: 220          # X_BED_SIZE (U20)
homing_speed: 40           # HOMING_FEEDRATE_MM_M X/60

[stepper_y]
step_pin: PB7
dir_pin: PB6               # INVERT_Y_DIR = false
enable_pin: !PB8
microsteps: 16
rotation_distance: 40      # 80 steps/mm
endstop_pin: ^!PC15        # Y_MIN_PIN, pullup + actif bas
position_endstop: 0
position_min: 0
position_max: 220          # Y_BED_SIZE (U20)
homing_speed: 40

[stepper_z]
step_pin: PE0
dir_pin: !PB9              # INVERT_Z_DIR = true
enable_pin: !PE1
microsteps: 16
rotation_distance: 8       # 400 steps/mm → vis M5 pas de 2mm × 4 starts = 8mm/tr
                           # (ou 400/16 * rotation = 2 → vis M5 simple = 2mm)
                           # Vérifier : rotation_distance = 200*microsteps / steps_per_mm
                           #          = 200*16/400 = 8
endstop_pin: probe:z_virtual_endstop   # BLTouch gère le homing Z
position_min: -5           # Autorise un Z légèrement négatif pour Z offset
position_max: 250          # Z_MAX_POS (U20)
homing_speed: 6            # HOMING_FEEDRATE_MM_M Z/60
second_homing_speed: 3     # Z_PROBE_FEEDRATE_SLOW

# =============================================================================
# EXTRUDEUR
# =============================================================================

[extruder]
step_pin: PE3
dir_pin: PE2               # INVERT_E0_DIR = false
enable_pin: !PE4
microsteps: 16
rotation_distance: 32.653  # 200*16/98 = 32.653 (DEFAULT_AXIS_STEPS 98 steps/mm)
nozzle_diameter: 0.400
filament_diameter: 1.750   # DEFAULT_NOMINAL_FILAMENT_DIA
heater_pin: PD3            # HEATER_0_PIN (MOSFET open-drain actif bas → voir note)
sensor_type: Generic 3950  # TEMP_SENSOR_0 = 1 (100K NTC) — à affiner si nécessaire
sensor_pin: PA0            # TEMP_0_PIN
min_temp: 0
max_temp: 270              # HEATER_0_MAXTEMP - 5°C de marge
min_extrude_temp: 170
max_extrude_only_distance: 200  # EXTRUDE_MAXLENGTH
pressure_advance: 0.0      # À calibrer via test tour (Linear Advance non configuré)

# PID Buse — VALEURS MARLIN, à ré-étalonner avec PID_CALIBRATE HEATER=extruder TARGET=205
control: pid
pid_Kp: 17.22
pid_Ki: 1.00
pid_Kd: 74.22

# =============================================================================
# PLATEAU CHAUFFANT
# =============================================================================

[heater_bed]
heater_pin: PA8            # HEATER_BED_PIN (MOSFET open-drain actif bas → voir note)
sensor_type: Generic 3950  # TEMP_SENSOR_BED = 1
sensor_pin: PA1            # TEMP_BED_PIN
min_temp: 0
max_temp: 145              # BED_MAXTEMP - 5°C de marge

# PID Plateau U20 — VALEURS MARLIN, à ré-étalonner avec PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_Kp: 841.68
pid_Ki: 152.12
pid_Kd: 1164.25

# NOTE MOSFETS OPEN-DRAIN :
# La carte V08 utilise des MOSFETs open-drain. Si les chaufferettes restent
# allumées (chauffage inversé), préfixer les broches avec '!' :
#   heater_pin: !PD3 / heater_pin: !PA8

# =============================================================================
# VENTILATEUR
# =============================================================================

[fan]
pin: PA15                  # FAN0_PIN
kick_start_time: 0.5       # Aide au démarrage (similaire FAN_MIN_PWM)
off_below: 0.05            # Seuil en dessous duquel le ventilateur s'arrête

# =============================================================================
# BLTOUCH (3D Touch Geeetech)
# =============================================================================

[bltouch]
sensor_pin: ^PE6           # Z_MIN_PIN (signal déclenchement, pullup ^ requis)
control_pin: PE5           # SERVO0_PIN V08 (signal déploiement)
x_offset: -38              # NOZZLE_TO_PROBE_OFFSET X
y_offset: -8               # NOZZLE_TO_PROBE_OFFSET Y
#z_offset: -0.5            # À définir avec PROBE_CALIBRATE (valeur initiale Marlin)
speed: 3.5                 # Z_PROBE_FEEDRATE_SLOW
lift_speed: 7              # Z_PROBE_FEEDRATE_FAST
samples: 2
sample_retract_dist: 3.0
stow_on_each_sample: false

# Safe Z homing : home Z au centre du plateau
[safe_z_home]
home_xy_position: 110, 110   # Centre du plateau (220/2, 220/2)
speed: 50
z_hop: 10
z_hop_speed: 7

# =============================================================================
# MAILLAGE DU PLATEAU (était AUTO_BED_LEVELING_BILINEAR 8x8)
# =============================================================================

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10           # PROBING_MARGIN = 10 (coord. du palpeur)
mesh_max: 175, 205         # Limité par x_offset=-38 : max nozzle x = 220 → probe x = 182
                           # Conservatif : 175 pour éviter le débordement
probe_count: 8, 8          # GRID_MAX_POINTS_X = 8
mesh_pps: 2, 2
algorithm: bicubic         # Meilleur résultat qu'interpolation bilinéaire pour 8x8
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0

# =============================================================================
# CAPTEUR FIN DE FILAMENT
# =============================================================================

[filament_switch_sensor filament_runout]
switch_pin: PC0            # FIL_RUNOUT_PIN = X_MAX_PIN
                           # FIL_RUNOUT_STATE = HIGH → filament absent quand HIGH
pause_on_runout: true
runout_gcode:
  M600                     # Changement de filament
insert_gcode:
  M117 Filament inséré

# =============================================================================
# LED BOARD
# =============================================================================

[output_pin board_led]
pin: PC2                   # LED_PIN
value: 1

# =============================================================================
# MACROS
# =============================================================================

[gcode_macro PRINT_START]
description: Préparation avant impression
gcode:
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
  G28                          ; Home tous les axes
  BED_MESH_CALIBRATE            ; Maillage du plateau
  G1 Z5 F600
  M190 S{BED_TEMP}              ; Attendre température plateau
  M109 S{EXTRUDER_TEMP}         ; Attendre température buse
  G92 E0                        ; Réinitialiser extrudeur
  G1 X5 Y20 Z0.3 F5000         ; Position départ
  G1 X5 Y200 E20 F1500         ; Ligne de purge
  G92 E0

[gcode_macro PRINT_END]
description: Fin d'impression
gcode:
  M400                          ; Attendre fin de mouvement
  G92 E0
  G1 E-3 F1800                 ; Retract
  G91
  G1 Z10 F3000                 ; Remonter Z
  G90
  G1 X0 Y220 F5000             ; Garer tête
  M106 S0                       ; Éteindre ventilateur
  M104 S0                       ; Éteindre buse
  M140 S0                       ; Éteindre plateau
  M84                           ; Désactiver moteurs

[gcode_macro M600]
description: Changement de filament
gcode:
  PAUSE
  G91
  G1 E-5 F1800
  G1 Z10 F3000
  G90
  G1 X10 Y220 F5000

[gcode_macro PREHEAT_PLA]
description: Préchauffage PLA (PREHEAT_2)
gcode:
  M140 S60
  M104 S200

[gcode_macro PREHEAT_ABS]
description: Préchauffage ABS/CHROM (PREHEAT_1)
gcode:
  M140 S60
  M104 S210

# =============================================================================
# PAUSE / RESUME / CANCEL (requis pour M600 et runout)
# =============================================================================

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

# =============================================================================
# NOTES DE CALIBRATION APRÈS INSTALLATION
# =============================================================================
#
# 1. OFFSET Z (OBLIGATOIRE) :
#    PROBE_CALIBRATE → suivre la procédure paper test → SAVE_CONFIG
#
# 2. PID BUSE :
#    PID_CALIBRATE HEATER=extruder TARGET=205 → SAVE_CONFIG
#
# 3. PID PLATEAU :
#    PID_CALIBRATE HEATER=heater_bed TARGET=60 → SAVE_CONFIG
#
# 4. ROTATION DISTANCE EXTRUDEUR :
#    Marquer 100mm de filament, extruder 100mm, mesurer l'écart.
#    Corriger : rotation_distance = ancien × (commandé / réel)
#
# 5. MAILLAGE :
#    BED_MESH_CALIBRATE → BED_MESH_PROFILE SAVE=default → SAVE_CONFIG
#
# =============================================================================

